<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171719">
<title>FRAME Studio — v0.2</title>
<style>
:root{color-scheme:dark;--bg:#171719;--panel:#202023;--line:#38383e;--muted:#92929b;--text:#eeeef1;--accent:#e5b85c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{color:inherit;background:#29292d;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}
button.active{border-color:var(--accent);color:#ffe0a0;background:#51452e}
.app{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr) 120px}
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:#1c1c1f;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.12em}.brand span{color:var(--accent)}.spacer{flex:1}.workspace{display:grid;grid-template-columns:54px minmax(0,1fr) 245px;min-height:0}
.tools{display:flex;flex-direction:column;align-items:center;gap:8px;padding:9px 5px;background:var(--panel);border-right:1px solid var(--line)}
.tool{width:42px;height:42px;padding:0;font-size:18px}.stage{min-width:0;display:flex;flex-direction:column;background:#111113}
.stagebar{padding:10px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid #28282c}
.canvaswrap{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:16px;background-color:#151518;background-image:radial-gradient(#303036 1px,transparent 1px);background-size:18px 18px}
#artboard{width:min(100%,900px);height:auto;aspect-ratio:4/3;background:#f4f0e8;box-shadow:0 10px 45px #0009;touch-action:none}
.inspector{background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;font-size:12px}
.field input{width:115px;accent-color:var(--accent)}output{color:var(--accent);min-width:35px;text-align:right}
.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:25px;height:25px;border-radius:50%;padding:0}.swatch.selected{outline:2px solid var(--accent);outline-offset:2px}
.layer{display:flex;gap:7px;align-items:center;padding:8px;margin:5px 0;background:#29292d;border:1px solid transparent;border-radius:7px;font-size:12px}.layer.selected{border-color:var(--accent)}.layer span{flex:1}
.timeline{border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:12px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
@media(max-width:760px){.workspace{grid-template-columns:46px minmax(0,1fr)}.inspector{position:absolute;z-index:3;right:0;top:52px;bottom:120px;width:235px;box-shadow:-10px 0 30px #0008}.inspector.hidden{display:none}.tool{width:37px;height:37px}header{padding:0 7px}.brand{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">FRAME<span>•</span>STUDIO</div><span style="color:var(--muted);font-size:11px">v0.2 · AREA FILL</span><div class="spacer"></div><button id="undo">↶</button><button id="redo">↷</button><button id="toggle">☷</button><button id="export">PNG</button></header>
<div class="workspace">
<nav class="tools">
<button class="tool active" data-tool="pen" title="펜">✎</button>
<button class="tool" data-tool="eraser" title="지우개">◩</button>
<button class="tool" data-tool="line" title="직선">／</button>
<button class="tool" data-tool="fill" title="면 채우기">▧</button>
<button class="tool" id="addLayer" title="레이어 추가">＋</button>
<button class="tool" id="clear" title="선택 레이어 지우기">⌫</button>
</nav>
<main class="stage"><div class="stagebar">CANVAS · 1200 × 900 <span id="status" style="float:right">PEN</span></div><div class="canvaswrap"><canvas id="artboard" width="1200" height="900"></canvas></div></main>
<aside class="inspector" id="inspector">
<h3 style="font-size:11px;color:var(--muted)">BRUSH & FILL</h3>
<div class="field"><span>크기</span><input id="size" type="range" min="1" max="60" value="7"><output id="sizeOut">7px</output></div>
<div class="field"><span>채우기 허용 오차</span><input id="tolerance" type="range" min="0" max="100" value="24"><output id="tolOut">24</output></div>
<div class="field"><span>경계 여유</span><input id="edge" type="range" min="0" max="4" value="1"><output id="edgeOut">1px</output></div>
<h3 style="font-size:11px;color:var(--muted);margin-top:20px">COLOR</h3><div class="swatches" id="palette"></div>
<h3 style="font-size:11px;color:var(--muted);margin-top:20px">LAYERS</h3><div id="layers"></div>
<p class="note">면 채우기는 표시 중인 모든 레이어를 합성해 경계를 판독하고, 결과는 현재 선택한 레이어에만 기록합니다. 선화 레이어를 위에 두고 색상 레이어를 선택해 채색하세요.</p>
</aside>
</div>
<div class="timeline">FRAME 01 · 기본 드로잉 / 면 채우기 테스트<br><span style="color:#777">이 빌드는 Flood Fill 기능 검증용 브라우저 프로토타입입니다.</span></div>
</div>
<script>
const canvas=document.getElementById('artboard'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const W=canvas.width,H=canvas.height;
let tool='pen',color='#24242a',size=7,down=false,last=null,start=null;
const palette=['#24242a','#ffffff','#e95d4f','#e8b64f','#6c9c85','#6f86c9','#b78bc7'];
function layer(name){const c=document.createElement('canvas');c.width=W;c.height=H;return{name,visible:true,canvas:c,undo:[],redo:[]}}
let layers=[layer('면 / 톤'),layer('선화')];
let active=1;
function save(l){l.undo.push(l.canvas.toDataURL());if(l.undo.length>25)l.undo.shift();l.redo=[]}
function restore(l,stack,other){if(!stack.length)return;other.push(l.canvas.toDataURL());const im=new Image();im.onload=()=>{const g=l.canvas.getContext('2d');g.clearRect(0,0,W,H);g.drawImage(im,0,0);render()};im.src=stack.pop()}
function composite(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#f4f0e8';g.fillRect(0,0,W,H);layers.forEach(l=>{if(l.visible)g.drawImage(l.canvas,0,0)});return g}
function render(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f4f0e8';ctx.fillRect(0,0,W,H);layers.forEach(l=>{if(l.visible)ctx.drawImage(l.canvas,0,0)});document.getElementById('status').textContent=tool.toUpperCase();drawLayers()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),y:Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height)))}}
function stroke(a,b){const g=layers[active].canvas.getContext('2d');g.save();g.lineCap='round';g.lineJoin='round';g.lineWidth=size;g.strokeStyle=tool==='eraser'?'#f4f0e8':color;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore()}
function closeEnough(data,i,seed,tol){return Math.abs(data[i]-seed[0])<=tol&&Math.abs(data[i+1]-seed[1])<=tol&&Math.abs(data[i+2]-seed[2])<=tol&&Math.abs(data[i+3]-seed[3])<=tol}
function floodFill(x,y){
 const boundary=composite(),bg=boundary.getImageData(0,0,W,H),d=bg.data;
 const target=(y*W+x)*4,seed=[d[target],d[target+1],d[target+2],d[target+3]];
 const tol=+document.getElementById('tolerance').value;
 const rgb=parseHex(color);if(seed[0]===rgb[0]&&seed[1]===rgb[1]&&seed[2]===rgb[2])return;
 const seen=new Uint8Array(W*H),stack=[y*W+x],region=[];
 while(stack.length){const p=stack.pop();if(p<0||p>=W*H||seen[p])continue;seen[p]=1;const i=p*4;if(!closeEnough(d,i,seed,tol))continue;region.push(p);const px=p%W,py=(p/W)|0;if(px>0)stack.push(p-1);if(px<W-1)stack.push(p+1);if(py>0)stack.push(p-W);if(py<H-1)stack.push(p+W)}
 if(!region.length)return;
 save(layers[active]);const out=layers[active].canvas.getContext('2d');const image=out.getImageData(0,0,W,H),od=image.data;
 for(const p of region){const i=p*4;od[i]=rgb[0];od[i+1]=rgb[1];od[i+2]=rgb[2];od[i+3]=255}
 out.putImageData(image,0,0);
}
function parseHex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);const p=pos(e);if(tool==='fill'){floodFill(p.x,p.y);render();return}down=true;start=last=p;save(layers[active]);if(tool==='pen'||tool==='eraser')stroke(p,{x:p.x+.01,y:p.y+.01})});
canvas.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);if(tool==='line'){render();ctx.strokeStyle=color;ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke()}else if(tool==='pen'||tool==='eraser'){stroke(last,p);render()}last=p});
function end(e){if(!down)return;const p=pos(e);if(tool==='line')stroke(start,p);down=false;render()}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));render()});
function drawLayers(){const el=document.getElementById('layers');el.innerHTML='';layers.forEach((l,i)=>{const d=document.createElement('div');d.className='layer'+(i===active?' selected':'');const eye=document.createElement('button');eye.textContent=l.visible?'◉':'○';eye.onclick=()=>{l.visible=!l.visible;render()};const name=document.createElement('span');name.textContent=l.name;d.append(eye,name);d.onclick=e=>{if(e.target!==eye){active=i;drawLayers()}};el.append(d)})}
document.getElementById('addLayer').onclick=()=>{layers.push(layer('레이어 '+(layers.length+1)));active=layers.length-1;render()};
document.getElementById('clear').onclick=()=>{save(layers[active]);layers[active].canvas.getContext('2d').clearRect(0,0,W,H);render()};
document.getElementById('undo').onclick=()=>restore(layers[active],layers[active].undo,layers[active].redo);
document.getElementById('redo').onclick=()=>restore(layers[active],layers[active].redo,layers[active].undo);
document.getElementById('toggle').onclick=()=>document.getElementById('inspector').classList.toggle('hidden');
document.getElementById('export').onclick=()=>{const c=composite();c.canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='frame-studio.png';a.click();URL.revokeObjectURL(a.href)})};
document.getElementById('size').oninput=e=>{size=+e.target.value;document.getElementById('sizeOut').value=size+'px'};
document.getElementById('tolerance').oninput=e=>document.getElementById('tolOut').value=e.target.value;
document.getElementById('edge').oninput=e=>document.getElementById('edgeOut').value=e.target.value+'px';
const pal=document.getElementById('palette');palette.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{color=c;pal.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))};pal.append(b);if(c===color)b.classList.add('selected')});
// Enclosed sample shapes: line art is on the top layer, color goes to the separate paint layer.
const g=layers[1].canvas.getContext('2d');g.strokeStyle='#24242a';g.lineWidth=12;g.lineJoin='round';g.beginPath();g.arc(600,280,130,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(470,520);g.lineTo(730,520);g.lineTo(730,760);g.lineTo(470,760);g.closePath();g.stroke();
render();
</script>
</body>
</html>
