<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171719">
<title>FRAME Studio — v0.4</title>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">FRAME<span>•</span>STUDIO</div>
    <span class="version">v0.4 · VECTOR LINE STUDIO</span>
    <div class="spacer"></div>
    <button id="undo" aria-label="실행 취소">↶</button>
    <button id="redo" aria-label="다시 실행">↷</button>
    <button id="toggle" aria-label="속성 패널">☷</button>
    <button id="export">PNG</button>
  </header>

  <div class="workspace">
    <nav class="tools" aria-label="도구">
      <button class="tool active" data-tool="pen" title="펜">✎</button>
      <button class="tool" data-tool="vector" title="벡터 펜">⌁</button>
      <button class="tool" data-tool="select" title="선 선택 및 이동">↖</button>
      <button class="tool" data-tool="vector" title="벡터 펜">⌁</button>
      <button class="tool" data-tool="select" title="선 선택 및 이동">↖</button>
      <button class="tool" data-tool="eraser" title="지우개">◩</button>
      <button class="tool" data-tool="line" title="직선">／</button>
      <button class="tool" data-tool="fill" title="면 채우기">▧</button>
      <button class="tool" id="addLayer" title="레이어 추가">＋</button>
      <button class="tool" id="clear" title="선택 레이어 지우기">⌫</button>
    </nav>

    <main class="stage">
      <div class="stagebar">CANVAS · 1200 × 900 <span id="status">PEN</span></div>
      <div class="canvaswrap">
        <div id="pixiHost" aria-label="그리기 작업 영역"></div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <h3>BRUSH & FILL</h3>
      <div class="field"><label for="size">크기</label><input id="size" type="range" min="1" max="60" value="7"><output id="sizeOut">7px</output></div>
      <div class="field"><label for="tolerance">채우기 허용 오차</label><input id="tolerance" type="range" min="0" max="100" value="24"><output id="tolOut">24</output></div>
      <div class="field"><label for="edge">선화 아래 확장</label><input id="edge" type="range" min="0" max="4" value="1"><output id="edgeOut">1px</output></div>
      <section id="lineTools" hidden>
        <h3 class="section-title">SELECTED LINE</h3>
        <div class="field"><label for="lineColor">선 색상</label><input id="lineColor" type="color" value="#24242a"></div>
        <div class="field"><label for="lineWidth">선 굵기</label><input id="lineWidth" type="range" min="1" max="60" value="7"><output id="lineWidthOut">7px</output></div>
        <button id="deleteLine" class="delete-line">선 삭제</button>
      </section>
      <h3 class="section-title">COLOR</h3>
      <div class="swatches" id="palette"></div>
      <h3 class="section-title">LAYERS</h3>
      <div id="layers"></div>
      <p class="note">PixiJS가 화면 렌더링을 담당하고, 채색 데이터는 독립적인 Canvas 레이어에 보관합니다. 면 채우기는 표시 중인 레이어를 합성해 경계를 판독하고 선택한 레이어에 기록합니다.</p>
    </aside>
  </div>

  <div class="timeline">FRAME 01 · VECTOR LINE STUDIO<br><span>벡터 펜으로 그리고 선택 도구로 선을 이동·수정할 수 있습니다.</span></div>
</div>

<!-- The hidden canvas elements are the editable paint buffers, not the display surface. -->
<canvas id="artboardBuffer" width="1200" height="900" hidden></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
