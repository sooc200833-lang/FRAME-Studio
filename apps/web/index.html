<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FRAME Studio</title>
<link rel="stylesheet" href="./src/lobby.css">
</head>
<body class="lobby">
<main class="lobby-main">
  <header class="lobby-head">
    <div class="lobby-brand">FRAME<span>•</span></div>
    <p>그림과 애니메이션, 만화 배경을 한곳에서 만들어요.</p>
  </header>
  <nav class="workspaces" aria-label="작업 공간">
    <a class="workspace" href="./drawing.html">
      <span class="workspace-art art-drawing" aria-hidden="true"></span>
      <strong>그리기 스튜디오</strong>
      <span>벡터 선, 래스터 브러시, 레이어, 타임라인 애니메이션</span>
      <em>열기</em>
    </a>
    <a class="workspace" href="./background-studio.html">
      <span class="workspace-art art-3d" aria-hidden="true"></span>
      <strong>3D 배경 스튜디오</strong>
      <span>방·복도·거리 장면을 배치하고 만화 선과 톤으로 배경 만들기</span>
      <em>열기</em>
    </a>
    <div class="workspace planned" aria-disabled="true">
      <span class="workspace-art art-assets" aria-hidden="true"></span>
      <strong>에셋 라이브러리</strong>
      <span>자주 쓰는 소품, 장면, 브러시 모음</span>
      <em>준비 중</em>
    </div>
    <div class="workspace planned" aria-disabled="true">
      <span class="workspace-art art-motion" aria-hidden="true"></span>
      <strong>모션 스튜디오</strong>
      <span>카메라 움직임과 장면 연출</span>
      <em>준비 중</em>
    </div>
  </nav>
  <p class="lobby-note">작업은 이 브라우저에 자동 저장돼요. 3D 배경은 "그리기로 보내기"를 누르면 그리기 스튜디오의 맨 아래 레이어로 들어가요.</p>
</main>
</body>
</html>
