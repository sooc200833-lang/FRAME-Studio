<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151519"><title>FRAME · 3D Background Studio</title><link rel="stylesheet" href="./src/background-studio.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body>
<header class="topbar"><a class="brand" href="./index.html">FRAME <span>•</span></a><div class="heading"><b>3D Background Studio</b><small>독립형 배경 제작 프로토타입</small></div><div class="actions"><button id="save">저장</button><button id="png" class="primary">PNG 내보내기</button><button id="json">장면 파일</button><label class="file">불러오기<input id="load" type="file" accept=".json,application/json"></label></div></header>
<main class="layout">
<aside class="panel left"><section><h2>공간 프리셋</h2><div class="grid"><button data-scene="room" class="active">방</button><button data-scene="corridor">복도</button><button data-scene="street">거리</button><button data-scene="empty">빈 공간</button></div></section>
<section><h2>오브젝트 추가</h2><div class="grid"><button data-add="box">상자</button><button data-add="table">책상</button><button data-add="chair">의자</button><button data-add="column">기둥</button><button data-add="sphere">구체</button><button data-add="stairs">계단</button></div></section>
<section><div class="section-head"><h2>오브젝트</h2><button id="delete" class="quiet">삭제</button></div><div id="objects" class="objects"><p>오브젝트가 없습니다.</p></div></section><p class="hint">오브젝트를 선택하고 화면의 조작 핸들로 이동·회전·크기를 바꿔보세요.</p></aside>
<section class="stage"><div class="toolbar"><div><button data-mode="translate" class="active">이동</button><button data-mode="rotate">회전</button><button data-mode="scale">크기</button></div><div><button id="grid" class="active">그리드</button><button id="lines" class="active">외곽선</button><button id="reset">시점 초기화</button></div></div><div id="viewport"></div><footer><span id="sceneName">방 프리셋</span><span id="selectedName">선택된 오브젝트 없음</span><span>드래그: 회전 · 휠/핀치: 확대 · 우클릭/두 손가락: 이동</span></footer></section>
<aside class="panel right"><section><h2>카메라</h2><label>투영 방식<select id="projection"><option value="perspective">원근 투영</option><option value="orthographic">평행 투영</option></select></label><label>시야각<input id="fov" type="range" min="25" max="90" value="45"></label><div class="grid three"><button id="front">정면</button><button id="side">측면</button><button id="top">위</button></div></section>
<section><h2>만화 렌더링</h2><label class="check"><input id="toon" type="checkbox" checked> 셀 셰이딩</label><label class="check"><input id="outline" type="checkbox" checked> 검은 외곽선</label><label>선 굵기<input id="width" type="range" min="1" max="4" step=".25" value="1.5"></label><label>명암 단계<select id="steps"><option>3</option><option selected>4</option><option>5</option></select></label></section>
<section><h2>PNG 출력</h2><label class="check"><input id="transparent" type="checkbox" checked> 투명 배경</label><label class="check"><input id="noGrid" type="checkbox" checked> 그리드 제외</label><p class="hint">PNG는 드로잉 레이어에 사용할 수 있고, 장면 파일은 3D 편집을 이어갈 때 사용합니다.</p></section></aside>
</main><div id="toast"></div><script type="module" src="./src/background-studio.js"></script></body></html>
